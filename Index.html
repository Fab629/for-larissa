<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>For Larissa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.55),transparent 28%),radial-gradient(circle at 80% 10%,rgba(255,225,235,.5),transparent 30%),linear-gradient(135deg,#f7edf1,#efe5df 55%,#e9d9d0);color:#3b2b2d;font-family:Inter,sans-serif}
.box{text-align:center;max-width:420px;width:100%}
.heart{font-size:2.6rem;animation:pulse 1.8s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(2.4rem,9vw,3.6rem);margin:10px 0 6px}
.sub{font-family:Caveat,cursive;font-size:1.7rem;margin-bottom:28px}
input{width:100%;padding:14px 16px;font-size:1rem;font-family:Inter,sans-serif;border:1px solid rgba(80,50,40,.2);border-radius:10px;background:#fffaf4;color:#3b2b2d;text-align:center;outline:none}
input:focus{border-color:#8f5663;box-shadow:0 0 0 3px rgba(143,86,99,.15)}
button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:10px;background:#8f5663;color:#fff;font-size:1rem;font-family:Inter,sans-serif;cursor:pointer;transition:transform .2s ease,opacity .2s}
button:hover{transform:translateY(-2px)}button:disabled{opacity:.6;cursor:wait;transform:none}
.err{min-height:1.4em;margin-top:14px;font-size:.9rem;color:#a4414f}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body>
<div class="box" id="box"><div class="heart">&#9829;</div><h1>For Larissa</h1><div class="sub">Enter the password to open</div>
<input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
<button id="go">Open</button><div class="err" id="err"></div></div>
